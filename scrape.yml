# VictoriaMetrics scrape config.
# Targets come from the discovery service (file_sd), which rebuilds them from the
# current epoch's active participants. Nothing to edit here.
global:
  scrape_interval: 30s
scrape_configs:
  - job_name: gonka-epoch
    metrics_path: /v1/mlnodes/metrics
    scrape_timeout: 10s
    file_sd_configs:
      - files:
          - /etc/vm/sd/targets.json
